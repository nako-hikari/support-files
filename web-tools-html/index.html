<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tools Launcher</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Web%20Tools%20Launcher%22%2C%22short_name%22%3A%22Launcher%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230e0e11%22%2C%22theme_color%22%3A%22%2318181f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%25200%2520512%2520512%27%253E%253Crect%2520width%3D%27512%27%2520height%3D%27512%27%2520rx%3D%27128%27%2520fill%3D%27%2318181f%27%252F%253E%253Ccircle%2520cx%3D%27256%27%2520cy%3D%27256%27%2520r%3D%27128%27%2520fill%3D%27none%27%2520stroke%3D%27%23A77A99%27%2520stroke-width%3D%2732%27%252F%253E%253Cpath%2520d%3D%27M256%252064v64M256%2520384v64M64%2520256h64M384%2520256h64%27%2520stroke%3D%27%23A77A99%27%2520stroke-width%3D%2732%27%2520stroke-linecap%3D%27round%27%252F%253E%253C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    <meta name="theme-color" content="#18181f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            /* Nako-Default-Purple Color Palette */
            --bg-color: #0e0e11;
            --container-bg: #18181f;
            --input-bg: #0f0f12;
            --box-bg: #0f0f12;
            --accent-dark: #663657;
            --accent-dark-hover: #81456e;
            --accent-light: #A77A99;
            --accent-light-hover: #c5a4bc;
            --text-main: #b4b4bc;
            --text-muted: #5a5a66;
            --text-bright: #ffffff;
            --border-color: #2d2d38;
            --success-bg: #2a4f32;
            --success-border: #3b6e47;

            /* Spacing & Layout Scale */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --max-width: 900px;

            /* Borders & Depth Elevation */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --border-width: 1px;
            --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);

            /* Animation & Transitions */
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: var(--space-2xl) var(--space-lg);
            overflow-x: hidden;
        }

        @media (max-width: 600px) {
            body {
                padding: var(--space-lg) var(--space-sm);
            }
        }

        .main-container {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
        }

        header {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-deep);
            padding: var(--space-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-bright);
            margin: 0 0 var(--space-sm) 0;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background-color: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-bright);
            padding: var(--space-md);
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            transition: all var(--transition-normal);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 0 2px rgba(167, 122, 153, 0.25);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--space-lg);
            width: 100%;
        }

        .tool-card {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: var(--space-xl);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            cursor: pointer;
            transition: border-color var(--transition-normal), transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .tool-card:hover {
            border-color: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-deep);
        }

        .tool-card:active {
            transform: translateY(0);
        }

        .tool-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-bright);
            transition: color var(--transition-normal);
        }

        .tool-card:hover .tool-title {
            color: var(--accent-light-hover);
        }

        .tool-tag {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: "Courier New", Courier, monospace;
            word-break: break-word;
        }

        .no-results {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Clean Scrollbars */
        ::-webkit-scrollbar {
            height: 5px;
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: var(--radius-sm);
            transition: background var(--transition-normal);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-light);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Web Tools Launcher</h1>
            <div class="search-wrapper">
                <input type="text" id="search" class="search-input" placeholder="Search tools by name or tag..." autocomplete="off">
            </div>
        </header>

        <main id="tools-container" class="tools-grid">
            <!-- Dynamic elements populate here -->
        </main>
    </div>

    <script>
        // EDITABLE TOOLS ARRAY
        // Simply add, remove, or modify objects inside this array.
        const tools = [
            {
                title: "JSON Formatter",
                tag: "developer json format pretty parse",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Base64 Encoder",
                tag: "encoder decode base64 security text",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Regex Tester",
                tag: "regex matching expression pattern utility",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Markdown Previewer",
                tag: "markdown md editor format parser render",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "URL Encoder / Decoder",
                tag: "url uri formatting percent-encoding text",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            }
            // Array highly scales to support 50+ entries under the exact same schema.
        ];

        const searchInput = document.getElementById('search');
        const toolsContainer = document.getElementById('tools-container');

        function renderTools(filterText = '') {
            const cleanFilter = filterText.toLowerCase().trim();
            toolsContainer.innerHTML = '';

            const filteredTools = tools.filter(tool => {
                const matchTitle = tool.title.toLowerCase().includes(cleanFilter);
                const matchTag = tool.tag.toLowerCase().includes(cleanFilter);
                return matchTitle || matchTag;
            });

            if (filteredTools.length === 0) {
                const noResultsElement = document.createElement('div');
                noResultsElement.className = 'no-results';
                noResultsElement.style.gridColumn = '1 / -1';
                noResultsElement.textContent = 'No web tools match your criteria.';
                toolsContainer.appendChild(noResultsElement);
                return;
            }

            filteredTools.forEach(tool => {
                const card = document.createElement('a');
                card.className = 'tool-card';
                card.href = tool.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                const titleEl = document.createElement('div');
                titleEl.className = 'tool-title';
                titleEl.textContent = tool.title;

                const tagEl = document.createElement('div');
                tagEl.className = 'tool-tag';
                tagEl.textContent = tool.tag;

                card.appendChild(titleEl);
                card.appendChild(tagEl);
                toolsContainer.appendChild(card);
            });
        }

        // Live Real-Time Search Filtering via Input Event
        searchInput.addEventListener('input', (e) => {
            renderTools(e.target.value);
        });

        // Initialize execution on runtime load
        renderTools();

        // Minimal Inline Service Worker setup for instant self-contained offline functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'launcher-cache-v1';
                    const ASSETS = [
                        './',
                        './index.html'
                    ];

                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
                        );
                    });

                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((response) => response || fetch(e.request))
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);

                navigator.serviceWorker.register(workerUrl, { scope: './' })
                    .catch(err => console.log('Service Worker configuration bypassed: ', err));
            });
        }
    </script>
</body>
  </html>
