<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tools Launcher</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#18181f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0e0e11;
            --container-bg: #18181f;
            --input-bg: #0f0f12;
            --box-bg: #0f0f12;
            --accent-dark: #663657;
            --accent-dark-hover: #81456e;
            --accent-light: #A77A99;
            --accent-light-hover: #c5a4bc;
            --text-main: #b4b4bc;
            --text-muted: #5a5a66;
            --text-bright: #ffffff;
            --border-color: #2d2d38;
            --success-bg: #2a4f32;
            --success-border: #3b6e47;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --max-width: 900px;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --border-width: 1px;
            --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: var(--space-2xl) var(--space-lg);
            overflow-x: hidden;
        }
        @media (max-width: 600px) {
            body {
                padding: var(--space-lg) var(--space-sm);
            }
        }
        .main-container {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
        }
        header {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-deep);
            padding: var(--space-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-bright);
            margin: 0 0 var(--space-sm) 0;
        }
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        .search-input {
            width: 100%;
            background-color: var(--input-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-bright);
            padding: var(--space-md);
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            transition: all var(--transition-normal);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 0 2px rgba(167, 122, 153, 0.25);
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--space-lg);
            width: 100%;
        }
        .tool-card {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: var(--space-xl);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        .tool-card:hover {
            border-color: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-deep);
        }
        .tool-card:active {
            transform: translateY(0);
        }
        .tool-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-bright);
            transition: color var(--transition-normal);
        }
        .tool-card:hover .tool-title {
            color: var(--accent-light-hover);
        }
        .tool-tag {
            font-size: 0.85rem;
            color: var(--accent-light);
            font-family: "Courier New", Courier, monospace;
            word-break: break-word;
        }
        .no-results {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
        }
        ::-webkit-scrollbar {
            height: 5px;
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: var(--radius-sm);
            transition: background var(--transition-normal);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-light);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Web Tools Launcher</h1>
            <div class="search-wrapper">
                <input type="text" id="search" class="search-input" placeholder="Search tools by name or tag..." autocomplete="off">
            </div>
        </header>
        <main id="tools-container" class="tools-grid"></main>
    </div>

    <script>
        const tools = [
            {
                title: "Command Splitter",
                tag: "Minecraft",
                url: "https://nako-hikari.github.io/support-files/tools/command-splitter.html"
            },
            {
                title: "Base64 Encoder",
                tag: "encoder decode base64 security text",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Regex Tester",
                tag: "regex matching expression pattern utility",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Markdown Previewer",
                tag: "markdown md editor format parser render",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "URL Encoder / Decoder",
                tag: "url uri formatting percent-encoding text",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Auto Fill Rnd Command",
                tag: "Minecraft",
                url: "https://nako-hikari.github.io/minecraft-bedrock/tools/rnd_command_autofill.html"
            },
            {
                title: "Template Title",
                tag: "template tags spaces search terms keywords",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            },
            {
                title: "Template Title",
                tag: "template tags spaces search terms keywords",
                url: "https://nako-hikari.github.io/support-files/path/to/tool.html"
            }
        ];

        const searchInput = document.getElementById('search');
        const toolsContainer = document.getElementById('tools-container');

        function renderTools(filterText = '') {
            const cleanFilter = filterText.toLowerCase().trim();
            toolsContainer.innerHTML = '';

            const filteredTools = tools.filter(tool => {
                const matchTitle = tool.title.toLowerCase().includes(cleanFilter);
                const matchTag = tool.tag.toLowerCase().includes(cleanFilter);
                return matchTitle || matchTag;
            });

            if (filteredTools.length === 0) {
                const noResultsElement = document.createElement('div');
                noResultsElement.className = 'no-results';
                noResultsElement.style.gridColumn = '1 / -1';
                noResultsElement.textContent = 'No web tools match your criteria.';
                toolsContainer.appendChild(noResultsElement);
                return;
            }

            filteredTools.forEach(tool => {
                const card = document.createElement('a');
                card.className = 'tool-card';
                card.href = tool.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                const titleEl = document.createElement('div');
                titleEl.className = 'tool-title';
                titleEl.textContent = tool.title;

                const tagEl = document.createElement('div');
                tagEl.className = 'tool-tag';
                tagEl.textContent = tool.tag;

                card.appendChild(titleEl);
                card.appendChild(tagEl);
                toolsContainer.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderTools(e.target.value);
        });

        renderTools();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: './' })
                    .catch(err => {});
            });
        }
    </script>
</body>
</html>
