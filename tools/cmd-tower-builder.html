<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Block Tower Builder</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
    --bg-color: #0e0e11;
    --container-bg: #18181f;
    --input-bg: #0f0f12;
    --box-bg: #0f0f12;
    --accent-dark: #663657;
    --accent-dark-hover: #81456e;
    --accent-light: #A77A99;
    --accent-light-hover: #c5a4bc;
    --text-main: #b4b4bc;
    --text-muted: #5a5a66;
    --text-bright: #ffffff;
    --border-color: #2d2d38;
    --success-bg: #2a4f32;
    --success-border: #3b6e47;

    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 20px;
    --space-2xl: 24px;
    --max-width: 900px;

    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --border-width: 1px;
    --shadow-deep: 0 6px 16px rgba(0, 0, 0, 0.6);
    --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.3);

    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
    background: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: var(--space-2xl) var(--space-lg);
    display: flex;
    flex-direction: column;
    align-items: center;
}

@media(max-width: 600px) {
    body {
        padding: var(--space-lg) var(--space-sm);
    }
}

.wrapper {
    width: 100%;
    max-width: var(--max-width);
    display: flex;
    flex-direction: column;
    gap: var(--space-xl);
}

.header-group {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

h1 {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text-bright);
    margin: 0;
}

.subtitle {
    font-size: 13px;
    color: var(--text-muted);
}

.controls {
    display: flex;
    gap: var(--space-md);
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    background: var(--container-bg);
    padding: var(--space-md);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
}

button {
    padding: 8px var(--space-lg);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    transition: background var(--transition-fast), transform var(--transition-fast), color var(--transition-fast);
}

#addBtn {
    background: var(--accent-dark);
    color: var(--text-bright);
    border-color: transparent;
}

#addBtn:hover {
    background: var(--accent-dark-hover);
    transform: translateY(-1px);
}

#convertBtn {
    background: var(--container-bg);
    color: var(--accent-light);
}

#convertBtn:hover {
    background: var(--input-bg);
    color: var(--accent-light-hover);
    border-color: var(--accent-light);
    transform: translateY(-1px);
}

#exportPngBtn {
    background: #4b3666;
    color: var(--text-bright);
    border-color: #614585;
}

#exportPngBtn:hover {
    background: #5d4380;
    transform: translateY(-1px);
}

#copyBtn {
    background: var(--success-bg);
    color: var(--text-bright);
    border-color: var(--success-border);
    width: 100%;
    box-sizing: border-box;
}

#copyBtn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.sliderBox {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    background: var(--input-bg);
    padding: 6px var(--space-md);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-muted);
}

.sliderBox input[type="range"] {
    accent-color: var(--accent-light);
    cursor: pointer;
}

#sizeLabel {
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    min-width: 45px;
}

#tower {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    width: 100%;
}

.block {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    background: var(--container-bg);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    border: var(--border-width) solid var(--border-color);
    box-shadow: var(--shadow-deep);
    transition: border-color var(--transition-fast);
}

.block:hover {
    border-color: var(--accent-dark);
}

.block.dragging {
    opacity: 0.4;
    border-style: dashed;
}

.deleteBtn {
    background: transparent;
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: var(--radius-sm);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.deleteBtn:hover {
    background: #4a1d1d;
    color: #ff8888;
    border-color: #6e2b2b;
}

.number {
    width: 24px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    font-family: "Courier New", Courier, monospace;
    color: var(--text-muted);
}

.block img {
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
    background: var(--input-bg);
    padding: var(--space-xs);
    border-radius: var(--radius-sm);
    border: var(--border-width) solid var(--border-color);
}

.typeButtons {
    display: flex;
    gap: var(--space-sm);
    margin-left: auto;
    background: var(--input-bg);
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-md);
    border: var(--border-width) solid var(--border-color);
}

.typeBtn {
    width: 20px;
    height: 20px;
    border-radius: var(--radius-sm);
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    transition: transform var(--transition-fast);
}

.typeBtn:hover {
    transform: scale(1.1);
}

.typeBtn.active {
    border-color: var(--text-bright);
    box-shadow: 0 0 4px rgba(255,255,255,0.4);
}

.orange { background: #e67e22; }
.purple { background: #9b59b6; }
.green { background: #2ecc71; }
.darkgreen { background: #145a32; }

#output {
    width: 100%;
    height: 180px;
    background: var(--box-bg);
    color: var(--accent-light);
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    font-family: "Courier New", Courier, monospace;
    font-size: 13px;
    resize: vertical;
    box-sizing: border-box;
    white-space: pre;
    overflow-x: auto;
}

#output:focus {
    outline: none;
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 2px rgba(102, 54, 87, 0.3);
}

.footer {
    margin-top: var(--space-2xl, 32px);
    padding-bottom: var(--space-lg, 16px);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm, 8px);
    align-items: center;
    width: 100%;
}

.footer-title {
    font-size: 12px;
    color: var(--text-muted, #5a5a66);
    opacity: 0.75;
    letter-spacing: 0.5px;
}

.footer-links {
    display: flex;
    gap: var(--space-md, 12px);
    flex-wrap: wrap;
    justify-content: center;
}

.footer-links a {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-light, #A77A99);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.85;
    transition: opacity var(--transition-fast, 0.15s), color var(--transition-fast, 0.15s);
}

.footer-links a:hover {
    color: var(--accent-light-hover, #c5a4bc);
    opacity: 1;
}

.footer-links img {
    width: 16px;
    height: 16px;
    filter: brightness(0) invert(1);
    opacity: 0.9;
}

.footer-links a.kofi {
    color: #ff5fa2;
    font-weight: 500;
}

.footer-links a.kofi:hover {
    color: #ff8fc0;
}

.footer-links a.kofi img {
    width: 20px;
    height: 20px;
    filter: brightness(0) invert(1); 
    opacity: 0.95;
}
</style>
</head>
<body>

<div class="wrapper">

    <div class="header-group">
        <h1>Command Block Tower Builder</h1>
        <div class="subtitle">build a command block tower and export as png or code for .md and html</div>
    </div>

    <div class="controls">
        <button type="button" id="addBtn">+ Add Block</button>
        <button type="button" id="convertBtn">Convert to MD/HTML</button>
        <button type="button" id="exportPngBtn">Export PNG</button>

        <div class="sliderBox">
            <span>Size:</span>
            <input type="range" id="sizeSlider" min="32" max="256" value="50">
            <span id="sizeLabel">50px</span>
        </div>
    </div>

    <div id="tower"></div>

    <textarea id="output" placeholder="Generated markdown/html will appear here..." readonly></textarea>
    <button type="button" id="copyBtn">Copy</button>

    <div class="footer">
        <div class="footer-title">By Nako Hikari</div>
        <div class="footer-links">
            <a href="https://github.com/nako-hikari/" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub">
                GitHub
            </a>
            <a href="https://m.youtube.com/@NaCryst" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
                YouTube
            </a>
            <a href="https://www.tiktok.com/@nako_hikari_mc" target="_blank" class="social">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" alt="TikTok">
                TikTok
            </a>
            <a href="https://ko-fi.com/arialicee" target="_blank" class="social kofi">
                <img src="https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/kofi-icon.png" alt="Ko-fi">
                Support me on Ko-fi
            </a>
        </div>
    </div>

</div>

<script>
const tower = document.getElementById("tower");
const output = document.getElementById("output");
const sizeSlider = document.getElementById("sizeSlider");
const sizeLabel = document.getElementById("sizeLabel");

const BASE = "https://raw.githubusercontent.com/nako-hikari/support-files/main/assets/minecraft/";

const TYPES = {
    impulse: { image: BASE + "impulse.png", color: "orange" },
    repeat: { image: BASE + "repeat.png", color: "purple" },
    chain: { image: BASE + "chain.png", color: "green" },
    conditional: { image: BASE + "chain-conditional.png", color: "darkgreen" }
};

let blocks = [];

function addBlock(type = "chain") {
    blocks.unshift({ type });
    render();
}

function deleteBlock(index) {
    blocks.splice(index, 1);
    render();
}

function render() {
    tower.innerHTML = "";
    const totalBlocks = blocks.length;

    blocks.forEach((block, index) => {
        const div = document.createElement("div");
        div.className = "block";
        div.draggable = true;
        div.dataset.index = index;

        div.addEventListener("dragstart", () => div.classList.add("dragging"));
        div.addEventListener("dragend", () => div.classList.remove("dragging"));
        div.addEventListener("dragover", e => e.preventDefault());
        
        div.addEventListener("drop", e => {
            e.preventDefault();
            const from = Number(document.querySelector(".dragging").dataset.index);
            const to = index;
            const moved = blocks.splice(from, 1)[0];
            blocks.splice(to, 0, moved);
            render();
        });

        const del = document.createElement("button");
        del.className = "deleteBtn";
        del.textContent = "×";
        del.onclick = (e) => {
            e.stopPropagation();
            deleteBlock(index);
        };

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = totalBlocks - index;

        const img = document.createElement("img");
        img.src = TYPES[block.type].image;
        img.width = Number(sizeSlider.value);

        const typeButtons = document.createElement("div");
        typeButtons.className = "typeButtons";

        for (const key in TYPES) {
            const btn = document.createElement("div");
            btn.className = "typeBtn " + TYPES[key].color;
            if (block.type === key) btn.classList.add("active");

            btn.onclick = (e) => {
                e.stopPropagation();
                block.type = key;
                render();
            };
            typeButtons.appendChild(btn);
        }

        div.appendChild(del);
        div.appendChild(number);
        div.appendChild(img);
        div.appendChild(typeButtons);
        tower.appendChild(div);
    });
}

sizeSlider.addEventListener("input", () => {
    sizeLabel.textContent = sizeSlider.value + "px";
    render();
});

document.getElementById("addBtn").addEventListener("click", () => addBlock("chain"));

document.getElementById("convertBtn").addEventListener("click", () => {
    let html = `<div style="max-width: 35%; margin: 0 auto;">\n\n`;
    const totalBlocks = blocks.length;

    blocks.forEach((block, index) => {
        const currentNumber = totalBlocks - index;
        html += `${currentNumber}. <img src="${TYPES[block.type].image}" width="${sizeSlider.value}"><br>\n`;
    });

    html += `\n</div>`;
    output.value = html;
});

document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(output.value);
});

document.getElementById("exportPngBtn").addEventListener("click", () => {
    if (blocks.length === 0) return;

    const originalStyle = document.createElement('style');
    originalStyle.innerHTML = `
        .deleteBtn, .typeButtons { display: none !important; }
        .block { border-color: var(--border-color) !important; }
    `;
    document.head.appendChild(originalStyle);

    html2canvas(tower, {
        backgroundColor: null,
        useCORS: true,
        logging: false,
        scale: window.devicePixelRatio || 2, 
        imageTimeout: 0
    }).then(canvas => {
        originalStyle.remove();

        const uniqueId = Math.random().toString(36).substring(2, 6);
        const fileName = `cmd-tower-${blocks.length}-${uniqueId}.png`;

        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }).catch(err => {
        originalStyle.remove();
        console.error(err);
    });
});

addBlock("impulse");
</script>

</body>
</html>
